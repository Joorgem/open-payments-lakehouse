# .github/workflows/ci.yml
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # THE SUITE RUNS IN FOUR SHARDS, ONE RUNNER EACH, AND THE SPLIT IS BY MEASURED TIME.
  #
  # WHY IT WAS SPLIT AT ALL. On 2026-09-01 this job was KILLED at GitHub's 6-hour job
  # ceiling (run 33447642806, `cancelled` at 6h00m17s) on a tree that has passed in as
  # little as 30 minutes. Measured over 117 successful runs the median is ~14 min and the
  # maximum 4h53m -- a spread of more than 10x on the same code, which is runner
  # contention rather than the suite. One shard cannot reach the ceiling.
  #
  # WHY NOT `pytest -n auto`, WHICH IS THE OBVIOUS ANSWER AND IS WRONG HERE. This project
  # MEASURED that two Spark suites on one machine break each other:
  # `tests/bronze/test_ptax_rules.py` returned 11 failed / 31 passed with a second local
  # Spark suite beside it, and 42 passed on an identical rerun with nothing beside it.
  # `CLAUDE.md` carries "never two local Spark suites at once" because of that pair.
  # xdist is that condition by construction, so the shards go on SEPARATE RUNNERS and no
  # shard is internally parallel.
  #
  # WHY BY TIME AND NOT BY TEST COUNT, which would have split it wrong. Attributing the
  # green run's per-test log timestamps: `tests/triage_agent` is 271 tests and 32% of the
  # time, `tests/bronze` is 572 tests and 6%. Count does not predict cost; a Spark session
  # does.
  #
  # THE PARTITION IS EXHAUSTIVE BY CONSTRUCTION, WHICH IS THE PROPERTY THAT MATTERS. The
  # `rest` shard is defined by IGNORING the other three rather than by listing what it
  # runs, so a new top-level test directory joins it automatically instead of silently
  # running nowhere. `tests/test_ci_shards.py` locks that: it reads this file and fails if
  # the ignore list and the named shards ever disagree, and if the four shards do not
  # collect exactly what an unsharded run collects.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: triage
            paths: tests/triage_agent
          - shard: vault
            paths: tests/vault
          - shard: gold
            paths: tests/gold
          - shard: rest
            paths: >-
              tests
              --ignore=tests/triage_agent
              --ignore=tests/vault
              --ignore=tests/gold
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-groups --all-extras
      # Lint is the whole tree and is cheap, so it runs once, on the shard that owns no
      # directory of its own.
      - name: Lint
        if: matrix.shard == 'rest'
        run: uv run ruff check .
      - name: Unit tests (incl. version smoke + delta roundtrip)
        run: uv run pytest -v ${{ matrix.paths }}

  # THE LIVE POSTGRES PATH, VERIFIED SOMEWHERE OTHER THAN ONE WINDOWS BOX (plan T2b).
  # ADDITIVE: the `test` job's command is untouched. `addopts` deselects both `integration`
  # and `postgres` by default, and a second `-m` on the command line replaces that term
  # rather than intersecting it -- so this job selects exactly the three files that one
  # container can satisfy, where `-m integration` would also pull in Redpanda and two
  # live-WebDAV modules and turn red on them.
  #
  # PUBLISHED ON 5433, NOT THE DEFAULT MAPPING. `tests/integration/test_postgres.py`
  # hardcodes `port=5433`, and `probe_postgres_session.dsn()`'s compose fallback names it
  # too; a service container on 5432 would fail to connect while looking correctly
  # configured. The port is the one thing here that must match docker-compose.yml.
  #
  # NO JAVA STEP. Nothing selected by `-m postgres` starts a Spark session, and the pinned
  # GUC assertions are the point of the job -- `POSTGRES_*` below must stay in step with
  # docker-compose.yml's service, because the DSN's user/password/dbname are all `opl`.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opl
          POSTGRES_PASSWORD: opl
          POSTGRES_DB: opl
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U opl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-groups --all-extras
      - name: Live Postgres tests (the container-only slice)
        run: uv run pytest -m postgres -v

  # F5 T6: THE STREAMING PROOF, VERIFIED SOMEWHERE OTHER THAN ONE WINDOWS BOX.
  # ADDITIVE, on the `postgres` job's precedent: the `test` job's command is untouched,
  # and `addopts` deselects `redpanda` by default, so a second `-m` on the command line
  # replaces that term rather than intersecting it -- verified by collection: `-m redpanda`
  # selects 22 of 2,910 and every one of the 22 also carries `integration`, which an
  # intersection would have removed. (This comment said 2,820 until F5's closing review
  # re-collected it; the 22 was right and the total was one change-set stale.)
  #
  # WHY `docker compose` AND NOT A `services:` BLOCK, which is what the postgres job uses.
  #
  # THIS BLOCK HAS NOW BEEN WRONG TWICE, BOTH TIMES FROM MEMORY, AND BOTH ARE CORRECTED
  # HERE RATHER THAN DELETED. It first said a service container "cannot supply argv".
  # False: GitHub added `entrypoint` and `command` keys to `services:`, in the changelog
  # entry "GitHub Actions: Early April 2026 updates" (2026-04-02). The correction of that
  # claim then published two dates of its own -- an "announcement" and a GA -- and NEITHER
  # IS IN ANY PRIMARY SOURCE: the 2026-02-13 entry that date was attached to is about
  # Agentic Workflows. Checking a claim against a community discussion instead of the
  # changelog is the same defect as not checking it, wearing the appearance of rigour.
  #
  # THE DECISION SURVIVES ON THE OTHER GROUND, WHICH WAS ALWAYS THE STRONGER ONE. A
  # `services:` block would be a SECOND SPELLING of the broker's launch arguments, beside
  # the one `docker-compose.yml` already carries -- the defect class this repository
  # polices hardest, and the one the postgres job above pays for today by duplicating its
  # service definition (its own comment names the port as the thing that must stay in step
  # by hand). Compose has one spelling and CI reads it.
  #
  # THE SIDE EFFECT, STATED NARROWLY: this job runs `docker compose up -d --wait redpanda`
  # against the committed compose file, so THAT SERVICE and its healthcheck are exercised
  # by CI. The `postgres` service in the same file is still started by nobody -- the
  # postgres job re-declares it -- so CLAUDE.md's whole-stack line remains hand-run only.
  #
  # AND IT DOES NEED A JDK, WHICH IS THE OPPOSITE OF THE JOB ABOVE. The postgres job's
  # "NO JAVA STEP" comment is true of `-m postgres` and false of `-m redpanda`: these
  # tests start a local Spark session and resolve the Kafka connector from Maven, because
  # pyspark ships no kafka jar. `src/opl/spark.py` measures that closure at 11 artifacts /
  # 57,002 kB; `~/.ivy2/jars` ends up holding 14 / ~64,317 kB because Delta's three
  # resolve whether or not Kafka is asked for.
  redpanda:
    runs-on: ubuntu-latest
    # THE CEILING IS SET FROM THE MEASUREMENT OF WHAT THIS JOB RUNS, WHICH IS NOT ONE FILE.
    # `-m redpanda` is 22 tests across 5 files. Measured on the Windows dev box, and QUOTED
    # AS A RANGE because two runs of the SAME file disagree by 2.5x: `test_late_arrival_
    # boundary.py` took 2,170 s once and 885 s another time, seven tests both times. F4's
    # rule applies -- quote wall clock as a range or not at all -- and the ceiling below
    # stands on the larger, plus 128 s for the other 15 tests, plus checkout, `uv sync`
    # (cold pyspark ~320 MB), a cold Maven resolution and the image pull.
    #
    # 45 WAS THE FIRST NUMBER HERE AND IT WAS TOO TIGHT, on a stale 16-20 min figure that
    # belonged to the two-arm version of that file. The compounding is the reason the
    # margin is generous rather than snug: on a timeout cancellation `actions/cache`'s
    # post-step is not reliably run, so the Ivy jars are never saved and the NEXT run pays
    # the cold download again -- a first timeout makes the second more likely.
    #
    # LINUX IS EXPECTED TO BE FASTER AND NOBODY HAS MEASURED IT. The runner is 4 vCPU /
    # 16 GB against a dev box running the same `local[2]` / 2g session, so the expectation
    # is reasonable and is not evidence. The first green run on this branch is what
    # replaces this paragraph with a number.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-groups --all-extras

      # KEYED ON THE LOCKFILE, WHICH IS NOT THE SAME THING AS THE CONNECTOR COORDINATE, and
      # this comment said the opposite of the line below it until a review read the two
      # together. `opl.spark.KAFKA_CONNECTOR_PACKAGE` derives from `pyspark.__version__`, so
      # a pyspark bump is what SHOULD invalidate this -- but nothing here extracts that
      # version, and any dependency change rewrites `uv.lock` and misses the key. The
      # `restore-keys` prefix makes that a wasted ~64 MB entry rather than a cold download,
      # which is why the simpler key is kept. `~/.ivy2` is the right path: the resolution
      # writes both `cache/` and `jars/` under it and needs nothing else.
      - name: Cache the Ivy jars the Kafka connector resolves
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-

      # `--wait` BLOCKS ON THE HEALTHCHECK THE COMPOSE FILE ALREADY DECLARES, which is the
      # whole reason this job uses compose. The first version of this step re-spelled that
      # healthcheck as a 12-line polling loop -- a second spelling of the check, inside the
      # job whose stated reason for existing is that it refuses second spellings. Compose
      # on `ubuntu-latest` is 2.38.2, which supports `--wait`.
      - name: Start the broker and wait for its declared healthcheck
        run: docker compose up -d --wait redpanda

      # A CONTAINER THAT NEVER STARTED HAS NO LOGS. `docker compose logs` on a service that
      # never ran exits 0 and prints nothing, so `ps -a` comes first: it is the one that
      # distinguishes "never created" from "created and unhealthy".
      - name: What the broker did, if it did not come up
        if: failure()
        run: |
          docker compose ps -a redpanda
          docker compose logs redpanda

      - name: Streaming tests against the live broker
        run: uv run pytest -m redpanda -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TERRAFORM (`iac/`), AND IT IS `fmt -check` + `validate` AND NOTHING ELSE.
  #
  # WHY NO `plan`, WHICH IS THE OBVIOUS THIRD STEP AND IS THE ONE THAT WOULD LIE.
  # Measured in `iac/` with no credentials at all -- `DATABRICKS_HOST` and
  # `DATABRICKS_TOKEN` unset and `DATABRICKS_CONFIG_FILE` pointed at a path that does
  # not exist -- `terraform plan` over the committed defaults exits 0 and reports
  # `Plan: 1 to add`. Nothing in that configuration reads anything while the member list
  # is empty, so the plan never authenticates and never looks: `1 to add` is what it
  # prints whether or not the object is already there, and nothing in the run could tell
  # those two apart. Name one member and the same
  # command exits 1 on `cannot configure default credentials`. A `plan` step here would
  # therefore either fail for want of a secret or pass without meaning, decided by
  # which of those two shapes the configuration happened to be in that week.
  #
  # `fmt -check` and `validate` read nothing, which is the property that matters: they
  # mean the same thing on this runner as on the box that wrote them. The provider
  # falls back to `~/.databrickscfg` when nothing else configures it and a runner has
  # no such file, so a check that reads is a check whose two behaviours differ for a
  # reason nobody declared. The version is pinned to the one this was measured under
  # for the same reason. `tests/test_iac_terraform.py` locks both halves of this job.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      # THE ONE STEP IN THIS JOB THAT DOES NOT RUN IN `iac/`, and the override is
      # load-bearing rather than untidy. `tests/test_iac_terraform.py` sweeps `*.tf`
      # TREE-WIDE -- a `.tf` outside `iac/` would be a second Terraform nobody decided
      # on -- and its `_declared_blocks` regex cannot read a block that is indented
      # instead of starting its own line. `fmt -check` is the backstop that module names
      # for that case, so it has to reach as far as the sweep does. Measured over an
      # indented `resource` block in a `.tf` OUTSIDE `iac/`: from `iac/` this exits 0 and
      # the block is unread by both checks; from the root it exits 3 and names the file.
      - name: Format (the whole tree, not just `iac/`)
        working-directory: ${{ github.workspace }}
        run: terraform fmt -check -recursive .
      # `-backend=false`: there is no backend to configure and no state to touch, and
      # the provider is still downloaded, which is all `validate` needs. The committed
      # `.terraform.lock.hcl` carries linux_amd64 hashes for exactly this step -- a
      # lock written on one platform fails init on the other with a message about the
      # lock rather than about the configuration.
      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  # THE DEPLOY, AND THE DETECTOR THAT MAKES A MISSING DEPLOY LOUD -- ADR 0021 Decision 1.
  #
  # WHY CI DEPLOYS AT ALL, GIVEN THAT ADR 0009 REJECTED DEPLOY-TIME BINDING. It rejected
  # it because "nobody deployed at all" then gives `expected == actual == the old sha`
  # and PASSES -- the socios re-run that terminated SUCCESS having masked only bronze.
  # That objection is about a SILENCE, not about the value: nothing went red when the
  # deploy did not happen. A better value does not repair that; a detector for the
  # silence, placed where it cannot be skipped, does. So the deploy moves here, where it
  # runs on every merge whether or not anyone is watching, and the step after it reads
  # the wheel THE WORKSPACE holds and refuses anything that is not this commit.
  #
  # IT SHIPS INERT, AND THE GATE IS NAMED RATHER THAN WORKED AROUND. Creating the
  # secrets is the operator's decision and not this repository's; today `gh secret list`
  # prints nothing at all. So the first step decides and every later step stands down. A
  # SKIP THAT SAYS WHY is the whole requirement: a drift check that passes because it
  # never ran is the exact species this job exists to remove, so the disarmed path emits
  # a `::warning::` annotation and a run-summary line rather than a green nobody reads.
  #
  # WHY THE GATE IS A STEP AND NOT A JOB-LEVEL `if:`, WHICH IS THE OBVIOUS SPELLING AND
  # IS NOT AVAILABLE. Measured 2026-09-02 by pushing one-job workflows to a throwaway
  # branch and reading the runs back, rather than recalled:
  #
  #   job-level  `if: ${{ secrets.X == '' }}`  -> the run fails at 0s, no job is created,
  #                                               and `gh run view` reports "This run
  #                                               likely failed because of a workflow
  #                                               file issue"
  #   job-level  `if: ${{ env.X == '' }}`      -> the same 0s invalid-workflow failure
  #   step-level `if: ${{ secrets.X == '' }}`  -> the same 0s invalid-workflow failure
  #   step-level `if: env.X != ''` and
  #              `if: steps.<id>.outputs.…`    -> both parse and behave, and an ABSENT
  #                                               secret mapped into `env:` renders as
  #                                               the empty string, so the guarded steps
  #                                               skip
  #
  # So the job always starts, one step decides, and the rest read that step's output.
  # What is NOT established until this runs with the secrets present: that the armed
  # path works. Every arm above was measured disarmed.
  #
  # `needs: [test]` IS ONE NAMED GATE AND NOT AN ATTEMPT AT "every job". Listing the
  # other jobs here would be a closed enumeration that goes stale in silence the day a
  # job is added, which is this repository's own recurring defect. The `test` shards are
  # the whole unit suite by construction and `tests/test_ci_shards.py` locks that, so
  # one name covers it. `postgres` and `redpanda` are deliberately NOT gates: each
  # depends on a container, and a broker flake would then be what decides whether the
  # workspace gets `main`.
  #
  # ON A PUSH TO `main` ONLY. A pull request's head is not `main`'s head, so deploying
  # one would put a branch's wheel into the only workspace there is, and the check below
  # would then be comparing against a revision nobody merged.
  #
  # THIS JOB INSTALLS THE DATABRICKS CLI AND RUNS NO PYTEST, and that pairing is
  # load-bearing rather than tidy.
  # `tests/test_bundle_resource_allowlist.py -k swept_paths` needs that CLI and SKIPS
  # where there is none, and committed documents rest on it doing so -- derive which
  # with `git grep -ln test_ci_deploy -- .`, since each of them now cites the lock
  # instead of a grep. `tests/test_ci_deploy.py` refuses any job that both names
  # Databricks and runs the suite, so the sentence is enforced rather than re-checked
  # by hand.
  deploy:
    needs: [test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # THE EXPECTED SIDE, AND IT COMES FROM GITHUB RATHER THAN FROM THE WORKSPACE.
      # `github.sha` on a push to `main` is the commit that was merged. The other side
      # is read out of the deployed wheel. Derive both from one place and the check
      # passes always while looking exactly like a working one (ADR 0009).
      EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - name: The gate -- is there a Databricks credential in this repository's secrets?
        id: gate
        run: |
          why="no DATABRICKS_HOST/DATABRICKS_TOKEN secret exists, so nothing was deployed"
          why="$why and the workspace's deployed revision was NOT compared with main"
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "ARMED: deploying $EXPECTED_REVISION, then reading it back." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nothing deployed and nothing checked::INERT -- $why (ADR 0021)."
            echo "INERT: $why (ADR 0021)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.armed == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.armed == 'true'
        with: { python-version: "3.12" }

      # PINNED TWICE -- the action AND the CLI it installs -- for the reason the
      # `terraform` job pins its binary. v1.8.0 is the version every Databricks
      # measurement in this repository was taken under, including the resource-collection
      # sweep `tests/test_bundle_resource_allowlist.py` derives from `bundle schema`. The
      # action's own default is "latest", which is a different program on a different
      # week and would make a deploy's behaviour a function of the date.
      - uses: databricks/setup-cli@v1.8.0
        if: steps.gate.outputs.armed == 'true'
        with: { version: 1.8.0 }

      - run: uv sync --all-groups --all-extras
        if: steps.gate.outputs.armed == 'true'

      # `bundle deploy` runs the `artifacts:` build, which is `uv build --wheel`, so the
      # wheel this uploads is stamped by `hatch_build.py` with this checkout's HEAD --
      # `github.sha`, the value the next step expects. A dirty tree would be stamped
      # `+dirty` and refused by that step; a runner's checkout is clean, so that arm is
      # unexercised here and is exercised in `tests/test_revision_stamp.py` instead.
      #
      # `-t free` AND NEVER `-t prod`. The production target is declared in order never
      # to be deployed (ADR 0021 Decision 2): its `mode: production` is what renders
      # every `schedule:` block UNPAUSED, and unpausing them today buys a refusal at the
      # first task of every guarded job, on a cadence. `tests/test_ci_deploy.py` refuses
      # a step here that names it.
      - name: Deploy the bundle to `free`
        if: steps.gate.outputs.armed == 'true'
        working-directory: databricks
        run: databricks bundle deploy -t free

      # THE DETECTOR, AND IT RUNS AFTER THE DEPLOY ON PURPOSE. It reads the wheel the
      # WORKSPACE holds -- never `dist/`, which is this checkout again -- and compares
      # its build stamp with the revision GitHub says this run is for. Run before the
      # deploy it would report on the previous merge; run after, it reports whether this
      # one arrived.
      - name: Does the workspace hold this commit? (ADR 0021)
        if: steps.gate.outputs.armed == 'true'
        run: uv run python scripts/check_deployed_revision.py --expected "$EXPECTED_REVISION"
