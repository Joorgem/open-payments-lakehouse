# databricks/resources/bronze_estabelecimentos_job.yml
# One job YAML PER TABLE, deliberately -- not one for_each_task over the
# registry. Same two reasons as bronze_job.yml: for_each shares a single
# {{job.run_id}} and therefore one _batch_id across tables, which contradicts
# the one-batch-is-one-table's-ingest assumption the gate, promote_batch and the
# repromote operator job all rest on; and this job's ~9-minute single-task read
# has no runtime profile in common with the six tiny lookups, so a failure here
# must not block them.
resources:
  jobs:
    bronze_cnpj_estabelecimentos:
      name: opl-bronze-cnpj-estabelecimentos
      # MONTHLY, AND THE CADENCE IS THE SOURCE'S RATHER THAN OURS. Receita Federal
      # publishes one CNPJ snapshot per month; `docs/f0-validation-report.md` measured the
      # series gapless from 2023-05 onward. THE DAY IS A CHOICE AND NOT A MEASUREMENT:
      # nothing in this repository records which day of a month a snapshot appears, so the
      # 15th is picked to be unambiguously late rather than derived, and it is written here
      # as a choice so nobody reads it as one.
      #
      # 06:00 IS THE FIRST OF THREE TIERS on that day -- bronze here, the vault loads at
      # 09:00, the gold builds at 12:00. A CLOCK OFFSET IS NOT A DEPENDENCY: a bronze run
      # that fails does not stop the vault job three hours later from starting. Nothing
      # here fixes that and ADR 0021 records it rather than implying otherwise.
      #
      # NO `pause_status` IS WRITTEN HERE OR ANYWHERE ELSE IN THIS BUNDLE, and that is the
      # point rather than an omission. The TARGET'S MODE writes it, and writes the opposite
      # value under each mode -- `PAUSED` under `free` (`mode: development`), `UNPAUSED`
      # under `prod` (`mode: production`). Under the only target this repository deploys,
      # this schedule is deployed paused and cannot fire. See ADR 0021 for what a scheduled
      # run would otherwise carry as its expected revision, and why the answer is not one
      # this phase could ship.
      schedule:
        quartz_cron_expression: "0 0 6 15 * ?"
        timezone_id: America/Sao_Paulo
      parameters:
        - name: month
          # THE MONTH THIS RUN INGESTS, and this default is a value the tasks refuse
          # (opl.config.SENTINEL_MONTH). It was "2026-06" until F1.4b PR B, and the
          # change is not tidiness -- that default became a SILENT DUPLICATE-APPEND
          # trigger the moment the Auto Loader state was month-scoped.
          #
          # BEFORE month-scoping, launching this job without --params read 2026-06's
          # landing dir against a checkpoint that already recorded every one of those
          # files: a no-op, which is why the real month looked harmless. AFTER it
          # (opl.bronze.autoloader.checkpoint_location), the same launch finds an EMPTY
          # month-scoped checkpoint, treats all of 2026-06 as new, and appends a full
          # month into staging under a fresh _batch_id -- and promote.rows_of_batch
          # keys idempotence on _batch_id, so it returns 0 for the new batch and
          # carries the duplicate into bronze. Nothing fails; the row counts double.
          #
          # Same shape and same reason as the revision default below: a job parameter
          # has to have SOME default, no month is a valid one, so the default's whole
          # job is to fail. tests/test_job_yaml_wiring.py asserts that this value is
          # one require_month rejects, because a default that happened to be a real
          # month would put every un-parameterised run back on the path above.
          default: "REQUIRED-PASS-A-MONTH"
        - name: revision
          # THE REVISION THIS RUN IS LAUNCHED FOR, and this default is a value the
          # task refuses (opl.bronze.provenance.SENTINEL_REVISION). A job parameter
          # has to have SOME default and no revision is a valid one, so the default's
          # whole job is to fail -- same shape and same reason as the repromote job's
          # sentinel batch_id. A default that happened to be a real object name would
          # make every run launched without --params pass the check against a commit
          # nobody chose, which is why tests/test_job_yaml_wiring.py asserts that this
          # value is one the guard rejects.
          #
          # HOW A RUN IS LAUNCHED, now that this exists:
          #     databricks bundle run bronze_cnpj_estabelecimentos -t free \
          #       --params month=2026-07,revision=$(git rev-parse HEAD)
          default: "REQUIRED-PASS-A-REVISION"
      tasks:
        # FIRST, AND NOTHING BEFORE IT (ADR 0009). CI validates the repository and
        # never what is deployed: a green run is evidence about the wheel sitting in
        # the workspace, and that is HEAD only if somebody deployed HEAD -- a separate
        # act, by hand, with nothing checking it. On 2026-08-01 a socios re-run
        # terminated SUCCESS having masked only bronze, because the workspace was still
        # running a bundle deployed four commits earlier, and nothing went red.
        #
        # This task compares the revision above -- the operator's HEAD at the moment
        # the run was submitted -- against the revision the DEPLOYED wheel says it was
        # built from. Two sources, or the check compares an artefact against itself and
        # passes always. It starts no Spark session and touches nothing, so its whole
        # cost is a task start; the position is the value, because a check after the
        # unzip below reports the problem once several GB have moved.
        - task_key: assert_deployed_revision
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/assert_deployed_revision.py
            # No table and no month: this task is about the ARTEFACT, not the data.
            parameters: ["{{job.parameters.revision}}"]

        - task_key: unzip
          depends_on: [{ task_key: assert_deployed_revision }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/unzip_table.py
            parameters: ["estabelecimentos", "{{job.parameters.month}}"]

        - task_key: ingest
          depends_on: [{ task_key: unzip }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/bronze_ingest.py
            parameters: ["estabelecimentos", "{{job.run_id}}", "{{job.parameters.month}}"]

        - task_key: dq_gate_batch
          depends_on: [{ task_key: ingest }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/dq_gate_batch.py
            parameters: ["estabelecimentos", "{{job.run_id}}"]

        - task_key: check_bad_rows
          depends_on: [{ task_key: dq_gate_batch }]
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.dq_gate_batch.values.bad_row_count}}"
            right: "0"

        - task_key: promote
          depends_on: [{ task_key: check_bad_rows, outcome: "true" }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/promote_batch.py
            # --in-flow declares "this batch_id is the run executing this task",
            # which is the ONLY caller that can say so truthfully. It is what
            # lets a scheduled run whose batch is empty (no new file arrived)
            # succeed as a no-op instead of being refused. The operator job
            # deliberately omits it, so a mistyped batch_id there is still
            # refused rather than exiting 0 having promoted nothing.
            parameters: ["estabelecimentos", "{{job.run_id}}", "--in-flow"]

        - task_key: fail_on_dq
          depends_on: [{ task_key: check_bad_rows, outcome: "false" }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/fail_on_dq.py
            # The TABLE, not a quarantine name. It used to be the quarantine
            # name hardcoded here, and that hardcoding sent estab triagers to a
            # table full of unrelated F1.2 lookup rows. fail_on_dq now derives
            # the quarantine from the registry, so the string that could be
            # wrong no longer exists in this file.
            parameters: ["estabelecimentos"]

        - task_key: reclaim_landing
          depends_on: [{ task_key: promote }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/reclaim_landing.py
            # Deletes only the inner files of THIS batch whose every staged row
            # is accounted for -- in bronze or in quarantine -- and at least one of
            # them in bronze. That wording is F4's and it replaced "the files bronze
            # proves it holds rows of", which is a strictly weaker proof: it admits
            # a file one of whose rows reached NEITHER table. Depends on promote and
            # nothing else: a file may go only after the rows are persisted. The
            # zips in the sibling zips/ dir are never touched -- they are the only
            # way back to the source when a parse defect is found after ingestion,
            # which happened twice in F1.3.
            #
            # WHY THE MONTH IS STILL PASSED, and this is not the reason that stood
            # here. It was "omitting it would silently fall back to DEFAULT.month",
            # which stopped being true when F4 wired the triage path: an omitted
            # month is now DERIVED from the `_snapshot_month` the ingest stamped and
            # REFUSED if the batch does not name exactly one -- `_month_underivable`
            # says outright that there is no default to fall back on.
            #
            # The present-day reason is the other half. A month that IS passed is
            # the input to `refuse_month_disagreement`, so handing over the value
            # this job already validated cross-checks the delete boundary against
            # the data the ingest wrote. A month that CONTRADICTS the stamp used to
            # put every proven file outside the scope, free nothing and exit 0 -- a
            # log indistinguishable from the containment guard catching a real
            # F1.3-style incident. It raises now, naming both months, before a
            # single unlink. That control is what this parameter buys, and it exists
            # only where a month is passed.
            #
            # It is still half of the delete boundary either way:
            # `landing_table(subdir, month)` is the only dir these deletes are
            # confined to, and reclaim_landing refuses anything that is not YYYY-MM
            # before Spark starts, so a run_id passed here raises instead.
            parameters:
              ["estabelecimentos", "{{job.run_id}}", "{{job.parameters.month}}"]

      environments:
        - environment_key: opl_env
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
