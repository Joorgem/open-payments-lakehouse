# databricks/resources/bronze_job.yml
# One job YAML PER TABLE, deliberately -- not one for_each_task over the
# registry, even though the task lists below are now near-identical:
#   * for_each shares a single {{job.run_id}} across its iterations, hence one
#     _batch_id for every table. The gate, promote_batch and the repromote
#     operator job all assume one batch = one table's ingest, so collapsing
#     these files would break the batch model to save declarative YAML.
#   * Failure domains stay apart. Estabelecimentos' ~9-minute single-task read
#     has nothing in common with these six tiny lookups' runtime profile, and in
#     one job a failure on the giant blocks the small tables.
resources:
  jobs:
    bronze_cnpj_lookup:
      name: opl-bronze-cnpj-lookup
      # NO SCHEDULE, AND IT IS THE ONE CNPJ JOB OF WHICH THAT IS TRUE. F8 gave this job the
      # monthly cadence its three siblings carry, on the same reason -- "the RFB CNPJ
      # snapshot is monthly" -- which is true of the PUBLISHER and beside the point for THIS
      # table. `opl.dataops.cadence` declares `lookup` PAUSED: deliberately not ingested
      # since 2026-06, on the scope decision F1.4b PR B recorded (the 2026-07 lookup zips
      # were never published in that month's set), and the freshness view prints it as
      # `paused_by_decision` rather than as a fault. A monthly cadence here would have this
      # repository declaring, in one commit, both that the table is expected monthly and
      # that it is deliberately not being ingested.
      #
      # WHICH HALF MOVED, AND WHY THAT ONE. The recorded decision has evidence behind it and
      # nothing in F8 revisited it; the cadence was a copied sentence. Re-deciding the
      # cadence instead would also have emptied the `PAUSED` kind of its only instance --
      # `opl.dataops.cadence` exists FOR this entry -- leaving a status arm nothing can
      # enter, which is the species this repository hunts rather than one it ships.
      #
      # LOCKED, not left to this comment: `tests/dataops/test_cadence.py` refuses a job that
      # ingests a PAUSED table and declares anything that fires it. The day the lookups
      # resume, that entry changes first and this schedule follows it.
      parameters:
        - name: month
          # The month this run ingests; the default is a value the tasks refuse
          # (opl.config.SENTINEL_MONTH), because a real month here re-ingests that
          # month against an EMPTY month-scoped checkpoint and silently doubles the
          # row counts -- the promote's idempotence is keyed on _batch_id and cannot
          # see it. Estabelecimentos' job carries the full argument.
          default: "REQUIRED-PASS-A-MONTH"
        - name: revision
          # The revision this run is launched for; the default is a value the guard
          # below refuses. Estabelecimentos' job carries the full argument.
          #
          #     databricks bundle run bronze_cnpj_lookup -t free \
          #       --params month=2026-07,revision=$(git rev-parse HEAD)
          default: "REQUIRED-PASS-A-REVISION"
      tasks:
        # FIRST, AND AHEAD OF THE INGEST rather than of an unzip: this is the one
        # ingestion job with no unzip task, because the lookup lands LOCAL (the
        # extraction host unzips and PUTs the inner files). So "before any work" here
        # means before the Auto Loader stream reads a byte and before the checkpoint
        # advances -- a checkpoint moved by a wheel nobody deployed marks those files
        # seen for every later run (ADR 0009).
        - task_key: assert_deployed_revision
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/assert_deployed_revision.py
            parameters: ["{{job.parameters.revision}}"]

        - task_key: ingest
          depends_on:
            - task_key: assert_deployed_revision
          environment_key: opl_env
          max_retries: 0
          spark_python_task:
            python_file: ../src/bronze_lookup_ingest.py
            # The lookup keeps its own entry point rather than taking `table`
            # like bronze_ingest.py: it routes six differently-named files into
            # ONE table by filename suffix, which is a genuine difference and
            # not a parameter. argv: [batch_id, month].
            parameters: ["{{job.run_id}}", "{{job.parameters.month}}"]

        - task_key: dq_gate_batch
          depends_on:
            - task_key: ingest
          environment_key: opl_env
          max_retries: 0
          spark_python_task:
            python_file: ../src/dq_gate_batch.py
            parameters: ["lookup", "{{job.run_id}}"]

        - task_key: check_bad_rows
          depends_on:
            - task_key: dq_gate_batch
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.dq_gate_batch.values.bad_row_count}}"
            right: "0"

        - task_key: promote
          depends_on:
            - task_key: check_bad_rows
              outcome: "true"
          environment_key: opl_env
          max_retries: 0
          spark_python_task:
            python_file: ../src/promote_batch.py
            # --in-flow declares "this batch_id is the run executing this task",
            # which is the ONLY caller that can say so truthfully. It is what
            # lets a scheduled run whose batch is empty (no new file arrived)
            # succeed as a no-op instead of being refused. The operator job
            # deliberately omits it, so a mistyped batch_id there is still
            # refused rather than exiting 0 having promoted nothing.
            parameters: ["lookup", "{{job.run_id}}", "--in-flow"]

        - task_key: fail_on_dq
          depends_on:
            - task_key: check_bad_rows
              outcome: "false"
          environment_key: opl_env
          max_retries: 0
          spark_python_task:
            python_file: ../src/fail_on_dq.py
            # The TABLE, not a quarantine name. fail_on_dq derives the
            # quarantine from the registry, so this cannot drift from what the
            # gate wrote -- the drift that once sent Estabelecimentos triagers
            # to a table full of unrelated F1.2 lookup rows.
            parameters: ["lookup"]

      # NO reclaim_landing TASK, where bronze_estabelecimentos_job.yml has one --
      # and the spec says the lookup shares "the registry, the gate, the promote and
      # the retention". It shares the retention MODULE; it cannot share the task.
      #
      # The reason recorded when this was written was the weak half of the truth
      # ("a handful of small files whose retention buys no meaningful Volume
      # quota"). The real one: reclaim_landing deletes a landed file once every
      # row that file staged is accounted for -- in bronze or in quarantine -- and
      # at least one of them is in bronze. (That is F4's proof; it replaced "once
      # bronze proves it holds its rows", which is strictly weaker because it admits
      # a file some of whose rows reached NEITHER table. The reason recorded here is
      # load-bearing -- it is why this job has no such task, and the registry-derived
      # lock in tests/test_job_yaml_wiring.py now pins the absence -- so it states
      # what the code does rather than what it used to.) Its whole safety argument
      # is that the zip in the sibling zips/<table> dir is still the way back when a
      # parse defect turns up after ingestion -- which happened twice in F1.3.
      #
      # The lookup lands LOCAL (opl.bronze.registry): scripts/extract_cnpj.py unzips
      # on the extraction host and PUTs only the inner file, so no zip of it ever
      # reaches the Volume -- cnpj/<month>/zips/ holds a subdirectory only for the
      # groups that land AS zips (2026-06: estabelecimentos; 2026-07: empresas,
      # estabelecimentos, socios) and never one for the lookup. The six landed CSVs
      # are therefore the ONLY copy in this workspace, and recovery would mean
      # re-downloading a monthly snapshot the RFB may already have rotated.
      # reclaim_landing.py now REFUSES any table that does not land as zips for
      # exactly this reason, so adding the task here would fail the job rather than
      # reclaim anything.
      environments:
        - environment_key: opl_env
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl   # opl wheel, built + uploaded by the artifacts block below
