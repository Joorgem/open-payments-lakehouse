# databricks/resources/gold_fact_payment_job.yml
# THE FACT THE WHOLE STAR EXISTS TO DEMONSTRATE: one row per payment EVENT, a degenerate
# `transaction_id`, and TWO role-playing foreign keys into ONE `dim_company`, each resolved
# AS OF that payment's own `event_time`.
#
# A FOURTH GOLD YAML RATHER THAN A TASK IN ANY OF THE THREE, and the argument is the one
# each of the others made in turn. `gold_dim_company_job.yml` takes a `months` window this
# task must not be given. `gold_conformed_dimensions_job.yml` builds three tables that cost
# seconds and is the job you re-run after a payment batch lands. `gold_pit_estabelecimento
# _job.yml` is a multi-hour build whose output nothing here reads. This job is the one that
# READS all of them, so it is also the one an operator re-runs on its own, and
# `databricks bundle run` has no task filter. The cost of the fourth file is the same two
# list edits the second and third paid: `_GUARDED_JOBS` in `tests/test_job_yaml_wiring.py`
# and `_GOLD_JOBS` in `tests/test_gold_job_wiring.py`, both enumerated rather than globbed
# precisely so a job added later cannot inherit a behaviour nobody chose.
#
# WHAT MUST HAVE RUN FIRST, AND IT IS NOT EXPRESSIBLE IN THIS FILE. `dim_company` and the
# three conformed dimensions are inputs: this build reads `dim_company`'s version chain and
# checks its own derived keys against the three conformed tables. SINCE F-API SO IS
# `bronze_ptax`, which is a fourth input and the first one from another LAYER: the fact's
# `fx_rate` is the most recent quote whose publication instant precedes the payment's own, so
# a fact built before the PTAX window is landed refuses rather than resolving. Databricks
# Asset Bundles have no cross-JOB dependency, so the order is operational and is written here
# rather than implied:
#
#     opl_bronze_payments  ->  opl_bronze_ptax  ->  opl_gold_dim_company
#                          ->  opl_gold_conformed_dimensions  ->  opl_gold_fact_payment
#
# Running it early does not corrupt anything -- a missing table fails the read BEFORE THE
# FIRST WRITE, and stale conformed dimensions are REPORTED as orphaned keys rather than
# refused, because the repair is to re-run the conformed build, which APPENDS.
#
# "BEFORE THE FIRST WRITE" IS LOAD-BEARING AND WAS NOT TRUE WHEN THIS FILE FIRST SAID IT.
# `dim_company` is read inside `fact_rows` and so fails before anything is appended, but
# the three conformed tables were read only by the orphan count, which runs AFTER the
# append: launched before the conformed job, this task wrote `fact_payment` in full and
# THEN failed table-not-found, so an operator saw FAILED against a correct table and the
# obvious repair -- drop it -- was the wrong one. `opl.gold.facts._conformed_members` now
# resolves all of them up front (four catalog lookups, no scan -- `dim_date` twice, once per
# role) so the failure lands where this sentence claims. The old order was harmless only
# because the conformed job had run.
#
# `bronze_ptax` IS ALSO READ BEFORE THE FIRST WRITE, and its own refusal is stronger than a
# missing table: `opl.gold.fx.rate_intervals` reduces the series to one row per
# (currency, quote_date) and REFUSES two landed rows that disagree on a rate, before
# `fact_rows` builds anything. That ordering is the whole of the phase's T4c -- the fan-out an
# unreduced FX join would cause is visible only to the post-write row-count check.
#
# NAMED `gold_*` AND NOT `vault_*`, for all three other gold jobs' reason:
# `tests/test_vault_job_wiring.py` globs `vault_*.yml`, asserts the result equals its own
# list, and demands every table in `opl.vault.domains.REGISTRY` be loaded by exactly one
# task of those files.
#
# NO `months` PARAMETER, FOR THE THIRD DISTINCT REASON IN THIS DIRECTORY. The SCD2 build
# DECLARES a window so it can refuse a snapshot the launch did not name; the PIT takes none
# because a later snapshot cannot move a pointer already written; this one takes none
# because a month window is a property of the RFB's SNAPSHOTS and this table is grained on
# PAYMENTS. A payment batch that landed since the last build is a set of new
# `transaction_id` values, and `opl.gold.facts._new_rows` finds them by reading the target.
#
# ------------------------------------------------------------------------------------
# PREDICTIONS, PUBLISHED BEFORE THE RUN THAT TESTS THEM (master protocol section 4.5).
# Every number below is DERIVED from declarations in this repository and from counts
# already published in `docs/f3-run-evidence.md` section 0.5; none of them needed a
# session. Two states are given because bronze is about to gain a stream.
#
# --- (A) AGAINST TODAY'S BRONZE: FOUR promoted streams, 40,150 rows --------------------
#
# THE TWO STATES THIS BLOCK USED TO CARRY ARE GONE, AND SAYING SO IS THE POINT. It published
# an (A) for two promoted streams (20,150 bronze rows, 20,000 fact rows, 18,400 tuples, 1
# `event_date_key`) and a (B) for `between-snapshots` landing (30,150 / 30,000 / 27,600 / 2).
# Both have HAPPENED, and F-API adds a fifth profile, so a third pair of columns would be two
# stale states above one live one. What is published below is the state after all four
# batches, which is the only one the next run can be marked against.
#
#   bronze rows                                   40,150   30,150 + the fifth stream's 10,000
#   DISTINCT transaction_id                       40,000   150 injected redeliveries, unchanged
#   COUNT(*) - COUNT(DISTINCT transaction_id)        150   `promotable`'s duplicate_count
#   DISTINCT business-attribute tuples            36,800   4 x (10,000 - 800), below
#
#   fact_payment rows                             40,000   one per distinct identity
#   COUNT(*) - DISTINCT tuples, IN THE FACT         3,200   the LEGITIMATE REPEATS, 4 x 800
#   (row, role) references                        80,000   2 roles x 40,000 rows
#   references resolving to the ghost, per role         0   unchanged, and still UNEXERCISED
#   rows orphaned per fact key, all four                0   see below
#   DISTINCT event_date_key reached                     3   20260620, 20260622, 20260801
#   DISTINCT fx_rate_date_key reached                   4   20260619 and 20260622 from the USD
#                                                          rows, plus the BRL rows' own days
#                                                          (20260620, 20260622, 20260801) --
#                                                          so the two date roles AGREE on the
#                                                          35,095 BRL rows and DIFFER on 2,864
#                                                          of the 4,905 USD ones.
#                                                          NOT 20260731: that quote is only
#                                                          reachable by a USD payment on
#                                                          2026-08-01 and there are none. The
#                                                          extraction reaches it because the
#                                                          series must be gapless past what
#                                                          the fact needs, which is a
#                                                          different statement
#   DISTINCT fx_rate values                             3   1.00000, 5.14420, 5.13950
#   rows with fx_rate = 1.00000 exactly            35,095   every BRL row, by definition and
#                                                          not by lookup
#   conversions past the last landed quote              0   every USD payment falls on
#                                                          2026-06-22 and the series runs to
#                                                          2026-07-31, so nothing converted at
#                                                          the open end of it. A NON-ZERO count
#                                                          is not a failure -- it is the only
#                                                          number in this log that can show a
#                                                          TRUNCATED extraction, which every
#                                                          other one reports as clean
#   widest fallback any conversion took            3 days   Monday 2026-06-22 back to Friday
#                                                          2026-06-19 for 2,864 rows, 0 for the
#                                                          2,041 same-day ones. A weekend is 3,
#                                                          a holiday weekend 4, Carnival 5 --
#                                                          none of which this layer may assert
#                                                          as a bound (opl.gold.fx), so a hole
#                                                          in the series shows up here
#
# WHERE 36,800 COMES FROM AND WHY IT IS A DEDUCTION RATHER THAN AN ESTIMATE.
# `opl.generator.stream` states `DISTINCT business-attribute tuple == event_count -
# repeat_count` as a property it BUILDS -- a base event whose tuple has already been emitted
# is re-derived under an incremented salt, and the generator refuses rather than emitting a
# collision. `_EVENT_COUNT = 10,000` and `_REPEAT_COUNT = 800` are shared by every profile, so
# each stream carries exactly 9,200. Across four streams the only way the total is below
# 36,800 is a CROSS-stream collision, which the guard does not cover: the tuple space is
# 1024 x 1023 ordered counterparty pairs x 4,999,901 amounts x <currencies> x 5 methods, and
# BOTH POPULATIONS IN THIS COMPARISON ARE BRL -- the existing 27,600 because no earlier
# stream draws USD, the fifth stream's 4,675 because that is the BRL half of its base events
# -- so the currency factor is ONE and the space is 2.6e13. A collision between them has
# probability 4,675 x 27,600 / 2.6e13 = about 5e-6. THIS BLOCK USED TO STATE THE SPACE AS
# "x 2 currencies = 5.2e13" AND THEN PRINT 5e-6, which does not follow from it: over 5.2e13
# the answer is 2.5e-6. The printed figure was right and its stated derivation was not --
# the same "argued about a population wider than the one it counted" defect the paragraph
# above this one already records once. Either way 36,800 is a prediction that can fail, and
# its failure would be a finding about the generator's independence rather than about gold.
#
# THE FX SPLIT, WHICH IS THE PHASE'S HEADLINE NUMBER AND IS DERIVED RATHER THAN ESTIMATED. The
# `cross-currency` window opens 2026-06-22T08:00:00.000Z and steps 5,000 ms per event; the
# 2026-06-22 quote publishes `dataHoraCotacao 2026-06-22 13:06:19.750415` READ AS BRT, i.e.
# 29,179,750.415 ms after the window opens, so the first index whose own instant FOLLOWS
# publication is ceil(29,179,750.415 / 5,000) = 5,836. Of those rows the ones that resolve a
# quote are the USD ones -- a BRL row consults no series at all:
#
#   USD rows falling back to 2026-06-19, venda 5.14420     2,864
#   USD rows resolving same-day 2026-06-22, venda 5.13950  2,041
#                                                          -----
#   USD rows in the fifth stream                           4,905
#
# TWO PAYMENTS ON ONE CALENDAR DAY WITH TWO DIFFERENT RATES is the property no calendar-day
# implementation can produce, and it is what the phase's closing test asserts. Both
# populations are non-empty under the fail-open UTC reading too (1,801 / 3,104), so the test
# does not rest on the timezone ruling being right -- only the counts move.
#
# `SUM(amount_brl)` IS NOT `SUM(amount) * rate` TO THE CENT, and that is arithmetic rather
# than a defect. `amount_brl` is rounded HALF-UP to two decimals AT THE ROW, so the two differ
# by up to half a centavo per row -- 4,905 rows' worth of rounding on this data.
#
# WHY THE GHOST IS PREDICTED AT ZERO AND WHY THAT IS NOT A SUCCESS (section 4.6). F1b
# measured 1,024 of 1,024 counterparties resolving to `hub_empresa`, `dim_company` carries
# one version chain per hub key with a floored `valid_from`, and every payment's instant
# therefore falls inside some version's half-open interval. `COALESCE(<as-of lookup>,
# GHOST)` CANNOT FIRE on this data. It is reported as an UNEXERCISED path; no unresolvable
# payment is manufactured to make the number non-zero.
#
# WHY THE ORPHAN COUNTS ARE PREDICTED AT ZERO, FOR FOUR KEYS AND NOT THREE. The conformed
# keys are DERIVED from the fact's own columns rather than looked up, so there is no ghost to
# fall back on. `dim_channel` and `dim_currency` hold the contract's declared domains and
# every profile's `currencies` is refused unless it is a subsequence of that domain
# (`opl.generator.stream._require_currencies`), so an unheld value is not expressible.
# `dim_date`'s span is measured from `bronze_payments`' own days AND from
# `sat_empresa_dados`' `applied_date`s (2026-06-13 .. 2026-08-01, 50 days), which covers
# every payment day AND every quote date the fallback can reach -- the earliest being
# 2026-06-19.
#
# "THE GENERATOR PICKS FROM THOSE SAME TUPLES BY INDEX" WAS THE OLD WORDING AND IT WENT STALE
# SILENTLY. F-API T1 split the declared DOMAIN from the tuple each profile DRAWS from, so the
# generator picks from `StreamSpec.currencies` and NOT from `payments.CURRENCIES`. What holds
# now is CONTAINMENT rather than identity, enforced by `_require_currencies` at import. The
# `tests/gold/test_conformed.py` copy of this sentence was corrected when the split landed and
# THIS copy, in a live job resource, was not -- which is why the zero-orphan prediction above
# spells the mechanism out instead of citing an identity that no longer holds.
#
# NOT "FROM THIS VERY TABLE", WHICH IS WHAT THIS LINE USED TO SAY. `covered_span` takes
# TWO sources and `gold_load_conformed_dimension.py` states the reason in capitals: the
# fact source is `bronze_payments`, because `fact_payment` DOES NOT EXIST when the calendar
# is built. The fact alone could not produce the low end either -- before the fourth stream
# every payment was 2026-08-01, so 2026-06-13 comes entirely from the satellite.
#
# --- THE FX SERIES THIS BUILD READS, AND THE ORDER THE REBUILD TAKES -------------------
#
#   bronze_ptax rows, reduced           42 quotes   2026-06-03 .. 2026-08-01, one row per
#                                                   (currency, quote_date) after the reduce
#   first / last publication instant                2026-06-03 and 2026-07-31, both ~13:0x BRT
#
# THE REDUCE IS NOT OPTIONAL AND ITS ABSENCE IS SILENT UNTIL IT IS NOT. `bronze_ptax` is
# written `mode("append")`, so a second fetch over the same window lands a second row per
# quote date and every USD fact row would be joined twice -- caught only by the post-write
# row-count refusal, whose message begins "THE TABLE ON DISK IS ALREADY WRITTEN".
#
# GAPLESSNESS IN BUSINESS DAYS IS REPORTED AND NOT REFUSED. Asserting it needs either a
# Brazilian holiday calendar -- the second spelling of "is there a quote" that this phase's
# T3 refuses, with a witness in the series itself -- or a gap bound drawn from this one
# window. So the three numbers above are printed instead, and a bounded extraction is visible
# rather than hidden behind a rate that resolved.
#
# >>> THIS TABLE MUST BE DROPPED BEFORE THIS JOB IS RE-RUN, AND THAT IS OPERATIONAL RATHER
# >>> THAN OPTIONAL. `opl.gold.facts._appended` writes `mode("append")` with no
# >>> `mergeSchema`, so the three new columns make the append FAIL -- which is the safe half.
# >>> WITH `mergeSchema` it would be worse: `_new_rows` anti-joins on `transaction_id`, so the
# >>> 30,000 rows already written would keep NULL FX FOREVER while every counter in the run log
# >>> reported clean. ADR 0015 already accepts a drop-and-rebuild at 69.2M rows and 120 s; this
# >>> table is 40,000 rows.
# >>>
# >>> THE ORDER, WHICH DABS CANNOT EXPRESS:
# >>>   1. land + ingest the fifth payment batch  (opl_bronze_payments, month=2026-06)
# >>>   2. fetch + ingest the PTAX window         (opl_bronze_ptax)
# >>>   3. re-run opl_gold_conformed_dimensions   (APPEND-safe: dim_currency gains USD,
# >>>                                              dim_date appends zero rows)
# >>>   4. DROP TABLE fact_payment
# >>>   5. re-run this job                        -> 40,000 rows
# >>>
# >>> Step 3 before step 5 and not after: the orphan counts are measured against the conformed
# >>> tables as they stand, so a fact built first would REPORT 4,905 orphaned currency keys --
# >>> correctly, and about a state whose repair is to re-run step 3 and then read the numbers
# >>> again.
#
# --- COST: AN EXTRAPOLATION AND NOT A MEASUREMENT ------------------------------------
#
# Labelled as such because nothing of this shape has been run on this platform. The build
# scans `dim_company` (~69.2M rows) ONCE PER ROLE, projected to four columns and filtered
# by a BROADCAST semi-join against at most 1,024 counterparty keys, so the dimension is
# never shuffled; everything else is 40,150 rows through one window, SEVEN broadcast joins
# (two roles, the FX intervals, and the four orphan anti-joins) and a ~40,000-row write.
#
#     wall clock   5-40 min, central ~15 min
#     storage      < 5 MB
#
# >>> UNMARKABLE, AND THAT IS ITSELF A FINDING. This run's per-task durations were never
# >>> captured, so there is no measurement to mark the interval against -- and the interval
# >>> could not have been marked honestly anyway, because its two stated anchors do not
# >>> produce it (see below). `docs/f3-workspace-run-evidence.md` §9 records it unmarked
# >>> rather than compared against a number that does not reconcile with its own derivation.
#
# CALIBRATED ON `link_empresa_estabelecimento`, which is the cheapest 72M-row operation
# measured on Free Edition serverless (`docs/f2-wave-1-workspace-run-evidence.md` §2.4:
# 499 s, and it WRITES 7.2 GB where this job writes about one megabyte).
#
# THE UPPER END DOES NOT FOLLOW FROM THE ANCHOR THIS BLOCK NAMES, and the arithmetic is
# left visible rather than quietly repaired. It cites `sat_estabelecimento_dados` at
# 5,630 s, which is 94 minutes, not the 40 published above; and it calls 5-40 min an "11x
# spread" when 40/5 is 8x. The published interval is therefore a JUDGEMENT -- the 72M-row
# scan here is two projected broadcast-filtered passes rather than a hashed write, so the
# satellite's 5,630 s was scaled down by a factor nobody wrote down. A prediction whose
# stated derivation does not close is a guess wearing a derivation's clothes, which is the
# thing this file's own header spends fifty lines refusing.
resources:
  jobs:
    opl_gold_fact_payment:
      name: opl-gold-fact-payment
      parameters:
        - name: revision
          # The revision this run is launched for; the default is a value the guard
          # below refuses, so a run launched without --params stops instead of checking
          # nothing.
          #
          #     databricks bundle run opl_gold_fact_payment -t free \
          #       --params revision=$(git rev-parse HEAD)
          default: "REQUIRED-PASS-A-REVISION"
      tasks:
        # FIRST, AND NOTHING BEFORE IT (ADR 0009). This job is in
        # `tests/test_job_yaml_wiring.py::_GUARDED_JOBS`, and the question that list asks
        # -- does a run against a wheel built from another revision matter? -- has its
        # sharpest answer here. This table's every column is a function of the deployed
        # code AND of code deployed EARLIER: the role keys are `dim_company`'s surrogate
        # keys, which are `xxhash64` over a business key and an `applied_date`, and the
        # three conformed keys are derived by `opl.gold.conformed` rather than looked up.
        # A wheel whose key mechanism differs by one line writes a fact that is
        # individually well-formed and joins to NOTHING, with the run reporting success --
        # and because the loader is append-only, the repair is dropping the table.
        #
        # Side-effect-free, which is required rather than incidental: `max_retries: 0`
        # does not prevent a retry on INTERNAL_ERROR, so a guard that touched a table
        # could touch it twice.
        - task_key: assert_deployed_revision
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/assert_deployed_revision.py
            parameters: ["{{job.parameters.revision}}"]

        # THE ONE BUILD TASK, HANDED ONE TABLE NAME. There is no dimension parameter and no
        # source parameter: `opl.gold.specs.PaymentFact` declares the dimension its roles
        # resolve against, the conformed dimensions it reaches and the ORDER it projects
        # their keys in, and the entry point resolves each against the gold registry. The
        # conformed tables reach the loader as a mapping KEYED BY DIMENSION NAME, so the
        # one paste that would be silent -- two of them transposed -- is not expressible.
        - task_key: fact_payment
          depends_on: [{ task_key: assert_deployed_revision }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/gold_load_fact.py
            # [gold table, load_date].
            parameters:
              - "fact_payment"
              # ONE BUILD TIMESTAMP FOR THE WHOLE RUN. `opl.gold.facts` gives `load_date`
              # no default precisely so that a loader cannot stamp its own clock; this is
              # the value the job's own parameters pin, and it survives a task retry.
              - "{{job.start_time.iso_datetime}}"

      environments:
        - environment_key: opl_env
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
