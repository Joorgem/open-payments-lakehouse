# databricks/resources/backfill_snapshot_columns_job.yml
# TEMPORARY operator job, RECREATED for the F1.4b migration and removed again in the
# commit that follows the successful run. It is in the bundle rather than a one-time
# `databricks jobs submit` because this is a portfolio repo: a resource is
# reviewable, re-deployable and shows up in the deployment state, where a submit is a
# shell invocation that exists only in somebody's scrollback.
#
# WHY IT EXISTS AGAIN. F1.4a used this same resource (added in 152e35f, removed in
# 9ce5251) to put the two snapshot columns on `bronze_cnpj_estabelecimentos`. It
# reached only that one table, because the script's target was hardcoded to the
# registry's `bronze` field. F1.4b measured what that left: `bronze_cnpj_estab_staging`
# (35 columns) and `bronze_cnpj_estab_quarantine` (36) carry neither column, nothing
# in this repo writes with `mergeSchema`, and so the 2026-07 estabelecimentos ingest
# would fail at the Delta write and the DQ gate's reject append would fail after it.
#
# WHY IT IS TEMPORARY, unchanged from F1.4a's reasoning: the script refuses any month
# the table does not already carry, so after these runs it can only ever repeat
# itself. A job resource that can only repeat a completed one-off is a button whose
# only remaining function is to rewrite a 71.9M-row table, and leaving it deployed
# beside the real ingestion jobs would mean the bundle no longer describes the
# pipeline.
#
# THE ROLE IS A LITERAL IN EACH TASK, NOT A JOB PARAMETER, and that is a safety
# decision rather than a style one. A `role` parameter would need a default; every
# candidate is bad. Defaulting it to `--bronze` means a forgotten `--params role=...`
# silently targets `bronze_cnpj_estabelecimentos`, which ALREADY carries 2026-06 --
# so `refuse_contradicting_month` reads it as a permitted idempotent repeat and
# rewrites all 71,874,448 rows, which is exactly the button this file's own comment
# above gives as the reason for deleting itself. Defaulting it to a sentinel is safe
# but useless: `resolve_target` refuses anything that is not one of the three flags,
# so every run would have to pass it anyway. As a literal, no role value can be
# forgotten or mistyped, and whether `--params role=--staging` survives the CLI's
# `stringToString` flag parsing never has to be answered.
#
# HOW IT IS RUN -- quarantine FIRST, alone, then staging:
#     databricks bundle deploy -t free --profile opl-free
#     databricks bundle run backfill_snapshot_columns -t free --profile opl-free \
#       --params table=estabelecimentos,month=2026-06 --only backfill_quarantine
#     databricks bundle run backfill_snapshot_columns -t free --profile opl-free \
#       --params table=estabelecimentos,month=2026-06 --only backfill_staging
#
# THAT ORDER IS THE POINT OF SPLITTING IT IN TWO. The quarantine table holds 0 rows,
# so per `fill_and_overwrite` its run is an `ALTER TABLE ADD COLUMNS` and no write at
# all -- seconds, and reversible by dropping two columns. It proves the whole
# mechanism (the flag, the target resolution, the ALTER) for free. The staging run
# rewrites 71,874,448 rows and is the expensive one. `depends_on` encodes the order
# so a plain `bundle run` with no `--only` cannot invert it, and running them as two
# tasks rather than one job means the cheap proof can be read before the expensive
# work starts.
#
# max_retries: 0, like every task in this bundle. It matters more here: the script
# prints the Delta RESTORE version BEFORE it writes, and an automatic retry would
# baseline its own row count off whatever the first attempt left behind -- exactly
# the unsafe re-run the script's own failure message warns against.
resources:
  jobs:
    backfill_snapshot_columns:
      name: opl-backfill-snapshot-columns
      parameters:
        - name: table
          # A real table rather than a sentinel, for the same reason
          # repromote_batch_job.yml gives: `table_spec` refuses anything
          # unregistered before Spark, and the month below cannot be defaulted
          # into anything harmful because the script refuses a month the table
          # does not already carry.
          default: "estabelecimentos"
        - name: month
          # NOT a sentinel and NOT omitted: `require_month` refuses a blank, and
          # `refuse_contradicting_month` refuses any month other than the one the
          # table already carries. Both refusals land before the write.
          default: "2026-06"
      tasks:
        - task_key: backfill_quarantine
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../../scripts/backfill_snapshot_columns.py
            parameters:
              ["{{job.parameters.table}}", "{{job.parameters.month}}", "--quarantine"]
        - task_key: backfill_staging
          # AFTER the quarantine task, never before it -- see the ordering note above.
          depends_on:
            - task_key: backfill_quarantine
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../../scripts/backfill_snapshot_columns.py
            parameters:
              ["{{job.parameters.table}}", "{{job.parameters.month}}", "--staging"]

      environments:
        - environment_key: opl_env
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
