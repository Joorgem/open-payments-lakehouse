# databricks/resources/repromote_batch_job.yml
# Operator tool, deliberately NOT part of the ingestion flow.
#
# WHY it exists: the batch-scoped gate blocks promotion of a batch that holds
# any rejected row, and a later normal run ingests new files under a NEW
# _batch_id -- so the blocked batch is never revisited and its good rows sit in
# staging with nowhere to go. That is not hypothetical: on 2026-07-27 run
# 315230730740144 ingested 9,506,871 rows of real RFB data, the gate rejected
# exactly one of them, and the other 9,506,870 were stranded.
#
# WHAT that one rejected row actually was, since the first diagnosis was wrong
# and this comment outlived it: the SOURCE record was valid CSV -- a literal
# newline inside a quoted field (RFC 4180 §2.6). Our reader split it in two,
# because Spark's CSV reader defaults to multiLine=false: a NULL-tailed "parent"
# that passed every DQ rule and was promoted, plus a "fragment" starting
# mid-field whose cnpj_basico was garbage. The gate rejected the fragment our
# own reader had manufactured, not dirty source data (ADR 0005; the reader now
# sets multiLine=true).
#
# This job re-runs the promote step against an explicitly named batch, for use
# AFTER a human has read the quarantine table and accepted the rejects. It is not
# a gate bypass: promote_batch re-applies the same DQ rules and appends only the
# rows that pass, so rejected rows stay out of bronze and remain in quarantine.
#
# AND THEN IT RECLAIMS, since F4. "The promote step alone" is what this comment
# said and what ADR 0006 called the defect: the in-flow path reclaims its landing
# files after the promote and this path did not, so a gate that fires every month
# left the reclaim unreachable for the life of the project. See the third task.
#
# HOW AN OPERATOR RUNS IT, now that promote_batch takes the table first and the
# run must name the revision it expects to be running (ADR 0009):
#     databricks bundle run repromote_triaged_batch -t free \
#       --params table=estabelecimentos,batch_id=315230730740144,revision=$(git rev-parse HEAD)
# All three parameters, always. A batch id belongs to exactly one table's ingest,
# and the `table` default below is a REAL table rather than a sentinel -- see why
# there.
#
# Two safety properties, deliberately in two different places:
#   * ISOLATION is this job's job -- living outside the ingestion flow is what
#     keeps anything automated from reaching it.
#   * VALIDATION is promote_batch.py's job. The batch_id default below is a
#     SENTINEL, i.e. a value the script refuses, alongside any batch_id that
#     names nothing in staging or bronze. This job also omits the ingestion
#     flow's --in-flow token on purpose, so an empty batch is refused here even
#     though it is a legitimate no-op there. It is NOT what makes the job safe:
#     before that check
#     existed, running this job with no --params matched no rows, appended
#     nothing and exited 0 -- a green run for a batch it never promoted. A
#     job-parameter default cannot validate anything.
resources:
  jobs:
    repromote_triaged_batch:
      name: opl-repromote-triaged-batch
      parameters:
        - name: table
          # A REAL table rather than a sentinel, and no second sentinel is needed
          # here, because neither wrong-default case can promote anything:
          #   * --params forgotten entirely: batch_id is the sentinel below and
          #     promote_batch refuses it before Spark. The table never matters.
          #   * only batch_id passed: the table silently becomes this default,
          #     which is the dangerous-looking case -- but a batch id belongs to
          #     exactly one table's ingest, so a lookup batch resolved against
          #     estabelecimentos finds zero rows in ITS staging and bronze, and
          #     an empty batch without --in-flow is refused (that is exactly what
          #     --in-flow is withheld from this job for). It ends red, having
          #     promoted nothing, not green having promoted nothing.
          # table_spec still refuses any unregistered name, so a typo is refused
          # too, before Spark, naming the valid tables.
          default: "estabelecimentos"
        - name: batch_id
          # Sentinel refused by promote_batch (opl.bronze.promote.SENTINEL_BATCH_ID),
          # because a job parameter has to have SOME default and no id is valid.
          default: "REQUIRED-PASS-A-BATCH-ID"
        - name: revision
          # The third parameter, and the same kind of sentinel for the same reason
          # (opl.bronze.provenance.SENTINEL_REVISION).
          #
          #     databricks bundle run repromote_triaged_batch -t free \
          #       --params table=estabelecimentos,batch_id=315230730740144,revision=$(git rev-parse HEAD)
          default: "REQUIRED-PASS-A-REVISION"
      tasks:
        # THE OPERATOR JOB IS GUARDED TOO, and that is a decision rather than
        # completeness (ADR 0009). This job APPENDS TO BRONZE -- the system of record --
        # re-applying whatever DQ rules the deployed wheel happens to carry, so a
        # repromote run against a stale wheel appends rows the current rules reject and
        # exits 0. The isolation argument above is about what STARTS this job; it says
        # nothing about which code the job then runs.
        #
        # It is also the job most likely to hit this: a repromote happens during triage,
        # hours or days after the ingestion run, by which time the local repo has moved
        # and the workspace has not.
        - task_key: assert_deployed_revision
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/assert_deployed_revision.py
            parameters: ["{{job.parameters.revision}}"]

        - task_key: promote
          depends_on: [{ task_key: assert_deployed_revision }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/promote_batch.py
            parameters: ["{{job.parameters.table}}", "{{job.parameters.batch_id}}"]

        # THE CONTROL ADR 0006 FOUND MISSING, AND THIS TASK IS F4's HEADLINE.
        #
        # `reclaim_landing` has never deleted a byte through a wired path: it
        # depends on `promote`, `promote` depends on `check_bad_rows outcome:
        # "true"`, and a batch with ONE reject never reaches it -- while THIS job,
        # the one that actually promotes a gated batch, had no reclaim task at all.
        # empresas and socios reject persistent source dirt every month, so a gate
        # that always fires silently disabled a different control for the life of
        # the project. Residue as this task shipped: 8,212,278,423 B of 2026-06
        # CSVs, deliberately left in the Volume so the debt stayed visible, against
        # a ~48 GB/month floor and no published quota.
        #
        # ADR 0006 named the fix and the reason it is safe: "`reclaim_landing` is
        # already guarded independently of the gate ... its real precondition is
        # 'these rows are persisted', and `repromote_triaged_batch` satisfies that
        # at exactly the point the in-flow promote does. Wiring it there restores
        # the control on both paths without loosening the gate on either."
        #
        # DEPENDS ON `promote`, exactly as the four ingestion jobs do, and that is
        # what carries the precondition. Note what the dependency is worth for the
        # batch this task was written for: an already-promoted batch does not
        # re-append, it returns ALREADY_PROMOTED from `plan_promotion` (bronze_rows
        # == staged_promotable) and exits 0 -- so the reclaim runs. A promote that
        # REFUSES raises, and this task never starts.
        #
        # NO MONTH PARAMETER, deliberately, where the ingestion jobs pass one. In a
        # repromote nobody has the ingest run's month in hand -- the reconciliation
        # view's remedy names a table and a batch id -- and a month retyped from
        # memory is the one wrong value whose failure mode is a GREEN run that
        # refuses every file and frees nothing. `reclaim_landing` derives it from
        # `_snapshot_month`, which the ingest stamped from its own validated month
        # parameter; see `resolve_month` there.
        #
        # `--any-table` says this job serves EVERY registered table, so one whose
        # files have no zip in the Volume (payments, ptax, merchant, lookup) is a
        # green no-op that prints why, not a red run on a repromote that worked.
        # It loosens no delete: those tables reclaim nothing either way.
        - task_key: reclaim_landing
          depends_on: [{ task_key: promote }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/reclaim_landing.py
            parameters:
              ["{{job.parameters.table}}", "{{job.parameters.batch_id}}", "--any-table"]

      environments:
        - environment_key: opl_env
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
