# databricks/resources/dataops_views_job.yml
#
# F4's imperative SQL, which is where governance and observability have to live
# because a Databricks Asset Bundle cannot express either. Measured against
# `databricks bundle schema` on CLI 1.8.0: there is no `tables` resource and no
# `View` resource at all, and `grants` exists only on Catalog, Schema, Volume,
# RegisteredModel, ExternalLocation and VectorSearchIndex. So a view, a table grant,
# a column mask and a tag are each "imperative SQL some job must issue" -- and the
# alternative, a statement an operator runs by hand once, is the documented-manual-
# state failure mode this phase set out to avoid.
#
# WHY IT TAKES NO `table` PARAMETER, unlike every ingestion job. Its output is TOTAL
# over the registry: `opl.bronze.reconcile` derives one arm per registered table, so
# a table registered later is reconciled the day it is registered. A `table`
# parameter here would be a coordinate that can be wrong for no gain -- and the
# paste-lock this repo runs over the ingestion jobs exists precisely because seven of
# their task parameter lists CAN be wrong.
#
# THE GUARD IS HERE FOR A REASON THIS LIST HAS NOT USED BEFORE. Every other guarded
# job writes rows: a stale wheel appends the wrong ones. This job writes none. What a
# stale wheel does here is worse in one specific way -- `CREATE OR REPLACE VIEW`
# takes the NAME the correct definition would have had, so a wheel from another
# revision leaves a reconciliation that is individually well-formed, that reports
# verdicts nobody reviewed, and that an operator reads off a dashboard believing it
# is the reviewed one. Nothing fails and nothing looks wrong.
resources:
  jobs:
    dataops_views:
      name: opl-dataops-views
      parameters:
        - name: revision
          # The same sentinel every guarded job declares
          # (opl.bronze.provenance.SENTINEL_REVISION), and the same reason: a job
          # parameter default cannot validate anything, so its only job is to be a
          # value the code refuses.
          #
          #     databricks bundle run dataops_views -t free \
          #       --params revision=$(git rev-parse HEAD)
          default: "REQUIRED-PASS-A-REVISION"
      tasks:
        - task_key: assert_deployed_revision
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/assert_deployed_revision.py
            parameters: ["{{job.parameters.revision}}"]

        - task_key: create_views
          depends_on: [{ task_key: assert_deployed_revision }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/create_dataops_views.py
            # No parameters, and the task refuses any. See its header's argv line:
            # the views are total over the registry, so there is no coordinate to
            # hand it and nothing for a wrong value to reach.
            parameters: []

        # F4 Task 3: ADR 0006's reversal condition 1, and NOT a gate change -- it reads
        # staging and prints counts. It lives in THIS job rather than in one of its own
        # because it is the same kind of thing as the views: imperative, total over the
        # registry, parameterless, and worth nothing unless the wheel that produced it is
        # the wheel somebody reviewed. Both facts follow: the revision guard above already
        # covers it, and a new job YAML would have had to be classified in
        # `tests/test_job_yaml_launch_guards.py`'s exact list for a guard it would then
        # duplicate.
        #
        # NO `depends_on` ON `create_views`, deliberately. It reads the STAGING TABLES
        # directly and reads no view, so ordering it after the view creation would
        # manufacture a dependency that does not exist -- and would make a view failure
        # swallow a measurement that had nothing to do with it. It depends on the guard
        # for the reason every task in this file does.
        #
        # THE DIRECTION THE PARAGRAPH ABOVE ARGUES ONLY ONE WAY, recorded because it is
        # the one this job pays for: sharing a job also means a FAILED MEASUREMENT fails
        # a run whose purpose was refreshing views. The two tasks run in parallel off the
        # guard, so `create_views` can have succeeded and the run still reports FAILED,
        # and `max_retries: 0` means it stays that way -- an operator refreshing a
        # dashboard stopped by a count nothing branches on.
        #
        # IT IS COUPLING AND NOT EXPENSE, and that is measured rather than assumed: on
        # job run 80788495253423 this task's execution_duration was 89 s for all
        # 337,776,032 staged rows across 15 (table, batch) pairs, against 40 s for
        # `create_views`. Accepted because the alternative is a second job YAML
        # duplicating the revision guard this one already carries, and because a
        # measurement that fails is a wheel-or-staging problem an operator wants stopping
        # a run. Revisit if the sweep grows to where a views refresh has to wait on it.
        - task_key: measure_rule_overlap
          depends_on: [{ task_key: assert_deployed_revision }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/measure_rule_overlap.py
            # No parameters, and the task refuses any. Its counts are total over the
            # registry and over every batch in each staging table, so there is neither a
            # table nor a batch to hand it.
            parameters: []

        # F4 Task 5: the OTHER HALF of the socios column mask -- who may open the tables
        # at all, and what the catalog says their columns hold. It lives in THIS job for
        # the same three reasons `measure_rule_overlap` does: it is imperative SQL a
        # bundle cannot express (there is no `tables` resource and `grants` is a field on
        # Catalog/Schema/Volume/RegisteredModel/ExternalLocation/VectorSearchIndex, never
        # on a table), it is total over the registry and takes no coordinate, and a NEW
        # job YAML would have to be classified in `tests/test_job_yaml_launch_guards.py`'s
        # exact list for a revision guard this job already carries.
        #
        # AND THE GUARD'S QUESTION HAS ITS SHARPEST ANSWER HERE. The two tasks above
        # write no row and create a view whose name a stale wheel would take. This one
        # REVOKES: its roster is a constant in `opl.bronze.pii_governance`, and anything
        # holding SELECT outside that roster loses it. A wheel from another revision
        # therefore issues a different set of revokes against the three tables holding
        # 55.8M rows of personal data, reports SUCCESS, and leaves an access state nobody
        # reviewed.
        #
        # NO `depends_on` ON THE OTHER TWO, deliberately, and for the reason
        # `measure_rule_overlap` states: it reads neither view and neither measurement, so
        # ordering it behind them would manufacture a dependency that does not exist and
        # would let a view failure swallow a governance change that had nothing to do with
        # it. It depends on the guard for the reason every task in this file does.
        #
        # THE COUPLING RUNS THE OTHER WAY TOO, recorded because this is the task that pays
        # for it: a governance failure now fails a run whose purpose was refreshing a
        # dashboard. Accepted for the same trade the block above accepts -- and here the
        # direction is the right one, because a run that could not settle who reads
        # personal data is a run an operator wants stopping.
        - task_key: apply_pii_governance
          depends_on: [{ task_key: assert_deployed_revision }]
          max_retries: 0
          environment_key: opl_env
          spark_python_task:
            python_file: ../src/apply_pii_governance.py
            # No parameters, and the task refuses any. What it governs is total over the
            # contracts that declare a mask, so there is no table to hand it.
            parameters: []

      environments:
        - environment_key: opl_env
          spec:
            environment_version: "3"
            dependencies:
              - ../../dist/*.whl
