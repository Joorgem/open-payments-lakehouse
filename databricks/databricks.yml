# NOTE: the brief's original draft set `workspace.host: ${DATABRICKS_HOST}`,
# assuming shell-style env var substitution. Databricks Asset Bundles do not
# expand raw shell env vars this way -- `${...}` is bundle variable/resource
# interpolation syntax (e.g. `${var.name}`), not envsubst. Confirmed via
# `databricks bundle validate`, which errored with the literal string
# "${DATABRICKS_HOST}" as an unresolved host. Fix: omit workspace.host and let
# it resolve from the `opl-free` CLI profile (passed via --profile), which
# already carries the correct host from .env.
bundle:
  name: open-payments-lakehouse

targets:
  free:
    mode: development
    default: true

# NOTE for whoever next needs to run something from `scripts/` as a job task:
# the bundle root is `databricks/`, so `scripts/` is OUTSIDE the sync root and
# `bundle validate` refuses such a `python_file` with "is not contained in sync
# root path". The F1.4a backfill got there by temporarily adding
#
#     sync:
#       paths: [".", "../scripts"]
#
# which moves the sync root to the repo root; the CLI then recomputes every
# resource's python_file for the new layout (`files/databricks/src/...` instead
# of `files/src/...`), verified with `bundle validate --output json`. It was
# reverted with the job resource it existed for -- see
# docs/f1.4a-migration-evidence.md -- because the permanent jobs should not carry
# that layout indirection for a one-off that has already run.
include:
  - resources/*.yml

artifacts:
  opl_wheel:
    type: whl
    build: uv build --wheel
    path: ..
