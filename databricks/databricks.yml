# NOTE: the brief's original draft set `workspace.host: ${DATABRICKS_HOST}`,
# assuming shell-style env var substitution. Databricks Asset Bundles do not
# expand raw shell env vars this way -- `${...}` is bundle variable/resource
# interpolation syntax (e.g. `${var.name}`), not envsubst. Confirmed via
# `databricks bundle validate`, which errored with the literal string
# "${DATABRICKS_HOST}" as an unresolved host. Fix: omit workspace.host and let
# it resolve from the `opl-free` CLI profile (passed via --profile), which
# already carries the correct host from .env.
bundle:
  name: open-payments-lakehouse

targets:
  free:
    mode: development
    default: true

  # THE SECOND TARGET, AND IT IS DECLARED IN ORDER NEVER TO BE DEPLOYED. See ADR 0021.
  #
  # WHY IT HAS TO EXIST AT ALL: `mode` is what writes `schedule.pause_status`, and it
  # writes the opposite value under each mode. Measured on an isolated scratch bundle --
  # two targets, one job, one `schedule:` block and NO `pause_status` in the source --
  # `databricks bundle validate -o json` renders `PAUSED` under `mode: development` and
  # `UNPAUSED` under `mode: production`. So under `free`, the only target this repository
  # deploys, every `schedule:` block below is deployed paused and cannot fire. A schedule
  # is a statement of cadence here; the target that would make one fire is this one.
  #
  # WHY IT IS NOT DEPLOYED, and either reason alone is sufficient. ADR 0018 Decision 6
  # rejected declarative governance on three grounds. Grounds 2 and 3 both need the bundle
  # to declare a SECURABLE; ground 3's failure mode is that `resources.<securable>.grants`
  # is authoritative and would revoke the platform's own `CREATE TABLE` on the schema every
  # pipeline writes into. WHICH TARGET EACH GROUND IS ABOUT IS NO LONGER ARGUED HERE, and
  # the deletion is the correction. This comment said "both are about a production target";
  # F8's second correction pass replaced that with ground 3 firing "under ANY target that
  # declares the securable"; and that is over-strong too, because dev mode's renaming is
  # per resource kind -- measured 2026-09-02 on a scratch bundle, `mode: development`
  # renamed a declared `schemas` and left a declared `volumes` alone. The per-kind argument
  # does not have to be got right, because the allowlist below refuses every non-job,
  # non-dashboard collection. Both grounds are *"assumed on strong evidence and not
  # proved"*, and neither is a thing to find out by trying it on the only workspace there
  # is.
  #
  # THE MECHANISM, WITH ITS EDGES, because a safety argument stated without them is a
  # promise wearing a mechanism's clothes. Both grounds need the bundle to declare a
  # SECURABLE -- `grants` rides on the object types ADR 0018 Decision 6 enumerates and never
  # on a table -- and it declares none. What enforces that is an ALLOWLIST rather than a
  # securable refusal: tests/test_bundle_resource_allowlist.py permits `jobs` and
  # `dashboards` and refuses every other collection, securable or not, so it also refuses
  # `secret_scopes` and `sql_warehouses` -- real state in this workspace, neither carrying
  # `grants`, and declaring either would be a legitimate act somebody has to argue for. No
  # list of securables is restated here: a restated enumeration is what went wrong once
  # already. NO COUNT OF PLACES IS RESTATED EITHER, for the same reason and a fresher one --
  # the count of places this sweep reads was published short, and so was the count of the
  # documents publishing it. The places a bundle document can declare a resource collection
  # are the ones the CLI's own schema types `config.Resources`; that module carries them as
  # code and re-derives them from `databricks bundle schema`, failing if the two differ --
  # `uv run pytest tests/test_bundle_resource_allowlist.py -k swept_paths`, which needs the
  # CLI and therefore SKIPS wherever there is none -- which is every CI job that runs
  # the suite, and is now ENFORCED rather than grepped for: F8's `deploy` job names
  # Databricks BECAUSE it deploys this bundle, and `tests/test_ci_deploy.py` refuses
  # any job that both names Databricks and runs pytest. It sweeps the
  # bundle documents under `databricks/` (`tests/job_yaml.py` carries which suffixes those
  # are). WHAT IT IS KNOWN NOT TO REACH, each measured and not offered as a complete list
  # of what nobody has thought of: a resource declared in a file `include`d from outside
  # `databricks/`, which validates; and any grant issued outside the bundle at all, which
  # is what `apply_pii_governance` does and what Decision 6 decided it should keep doing.
  #
  # WHY `root_path` IS HERE AND WHY IT IS INTERPOLATED. `mode: production` refuses to
  # validate without one -- *"target with 'mode: production' must set 'workspace.root_path'
  # to make sure only one copy is deployed"* -- and the operator's identity must not be
  # committed, so it is resolved per deploy from `${workspace.current_user.userName}`
  # rather than typed. The same rule as the warehouse id above: the NAME lives in git and
  # the workspace resolves it.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# NOTE for whoever next needs to run something from `scripts/` as a job task:
# the bundle root is `databricks/`, so `scripts/` is OUTSIDE the sync root and
# `bundle validate` refuses such a `python_file` with "is not contained in sync
# root path". The F1.4a backfill got there by temporarily adding
#
#     sync:
#       paths: [".", "../scripts"]
#
# which moves the sync root to the repo root; the CLI then recomputes every
# resource's python_file for the new layout (`files/databricks/src/...` instead
# of `files/src/...`), verified with `bundle validate --output json`. It was
# reverted with the job resource it existed for -- see
# docs/f1.4a-migration-evidence.md -- because the permanent jobs should not carry
# that layout indirection for a one-off that has already run.
# THE ONE BUNDLE VARIABLE, added by F4 Task 4 for the dashboard resource.
#
# A warehouse id is workspace-scoped platform state. `databricks bundle generate
# dashboard` hardcodes it into the resource YAML, and committing it AS A RESOURCE VALUE
# makes this repository's "reproducible from GitHub" claim false for exactly the artefact
# a reviewer is most likely to try redeploying into their own workspace -- the id resolves
# to nothing there, and the failure is at deploy time with no hint of why.
#
# THE LITERAL ID APPEARS BELOW, IN THIS COMMENT, AND THAT IS THE ONLY PLACE IT IS
# COMMITTED. Prose naming the hazard is not the hazard, and pretending otherwise would mean
# a rule this file could not state its own reason for. `tests/dataops/test_dashboard.py::
# test_no_workspace_scoped_warehouse_id_is_committed_as_a_resource_value` therefore sweeps
# the PARSED values of every committed bundle file rather than their raw text -- comments
# are gone by the time YAML is a document, so the claim it checks is exactly the claim that
# matters.
#
# `lookup:` asks the workspace for the id of the warehouse with this NAME, at validate
# time. Measured 2026-08-18: `databricks bundle validate -t free -o json` renders
# `"wh": {"lookup": {"warehouse": "..."}, "value": "13cf10c85b0f189d"}`, so the name is
# what lives in git and the id is resolved per workspace on every deploy. It is also why
# `bundle validate` now needs credentials for this bundle, which costs nothing here: no
# CI job has ever run `bundle validate`. What CI does run is not enumerated in this
# comment -- the enumeration that was here said "ruff and pytest" and was falsified twice
# in one phase, by the `terraform` job and then by `deploy`. The one fact this paragraph
# needs is narrower and derivable: `deploy` is the only job with a Databricks credential
# in its `env:` (`git grep -n 'secrets\.DATABRICKS' -- .github/`), and it runs
# `bundle deploy`, never `bundle validate`.
variables:
  wh:
    description: >-
      The SQL warehouse the dashboard runs on, resolved from its name so no
      workspace-scoped id is committed. See the comment above.
    lookup:
      warehouse: Serverless Starter Warehouse

include:
  - resources/*.yml

artifacts:
  opl_wheel:
    type: whl
    build: uv build --wheel
    path: ..
