[project]
name = "open-payments-lakehouse"
version = "0.0.0"
description = "Production-grade lakehouse on Databricks/Delta: real Receita CNPJ data + synthetic payment stream, Data Vault 2.0 -> Kimball, full DataOps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.3.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
    "psycopg[binary]==3.2.3",
    "confluent-kafka==2.6.1",
    "databricks-sdk==0.40.0",
    "requests==2.32.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires the docker compose stack running"]
addopts = "-m 'not integration'"
