[build-system]
# PINNED, and to the SAME version the dev group pins. `hatch_build.py` subclasses
# hatchling's build-hook interface and the tests read that file, so the two resolving
# independently means the suite can validate a hook against one version while
# `bundle deploy` builds the deployed wheel with another -- exactly the divergence the
# single-minor `databricks-sdk` bound exists to prevent, and here it decides whether the
# artefact gets a revision stamp at all. Raising this is a deliberate act: re-read
# `initialize`/`finalize` and `build_data["force_include"]` against the new release,
# and raise the dev-group pin in the same commit.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "open-payments-lakehouse"
version = "0.0.0"
description = "Production-grade lakehouse on Databricks/Delta: real Receita CNPJ data + synthetic payment stream, Data Vault 2.0 -> Kimball, full DataOps."
requires-python = ">=3.12,<3.13"
# NOTE (Task 6 deployment-spike finding): pyspark/delta-spark are intentionally
# NOT core wheel dependencies. Databricks serverless provides Spark in its base
# environment; installing pyspark into it breaks the wheel install (verified:
# Task 6 spike) -- pinning them here makes the opl wheel un-installable through
# a job's `environments.dependencies` pip install on this Free Edition workspace
# (confirmed empirically: client="2" rejects the wheel outright -- pyproject's
# requires-python >=3.12 doesn't match serverless env v2's Python 3.11.10;
# client="3" matches Python 3.12.3 but pip then fails to fetch the ~300MB
# pyspark wheel with a generic "Unable to find or download the required
# package" error, reproducible on repeat runs -- Free Edition's governed
# egress/serverless install budget can't complete that download). Local
# dev/CI installs it via the 'spark' extra below.
#
# NARROWED 2026-08-14 BY MEASUREMENT: it is the INSTALL BUDGET, not governed
# egress. The "egress/install budget" above is a disjunction this note could
# not separate at the time, and F-API Task 0 separated it -- a serverless task
# under {"environment_version": "3"} reached olinda.bcb.gov.br (HTTP 200, real
# body) AND an unrelated host for 192,973 bytes, on run 1112844532335593.
# Outbound HTTP is not governed off on this workspace, and databricks/src/
# fetch_ptax.py now depends on that in production. See
# docs/f-api-run-evidence.md section 0.8.
dependencies = [
    # Floor: 0.42.0 fixed databricks-sdk-py#878 (<=0.41.0 rewound the request
    # body only inside `_perform`'s `if error is not None` branch, so a raised
    # ConnectionError/Timeout skipped the rewind and the retry PUT only the
    # remainder -- the silently short object of F1.3 incident 1). The floor is
    # set far above that, at a current release, because ADR 0007 adopts the
    # multipart upload path deliberately; see that ADR for the version bisect.
    # Ceiling is the NEXT MINOR, not a wide range, and that is the point: in the
    # 0.40 -> 0.123 span we bisected, minor releases silently rewrote the upload
    # path three times (0.45.0 introduced multipart above 5 MiB; 0.69.0 rewrote
    # it as parallel presigned parts; 0.72.0 raised the threshold to 50 MiB).
    # None of those were breaking changes by the project's own reckoning -- #878
    # itself shipped under "Internal Changes" -- so a permissive ceiling means
    # absorbing an upload-semantics change without noticing, which is precisely
    # how F1.3 lost 1.37 GB of a part. Raising this bound is therefore a
    # deliberate act that requires re-reading the upload path and re-checking
    # UPLOAD_RETRY_TIMEOUT_SECONDS in opl.extraction.landing against it.
    "databricks-sdk>=0.123.0,<0.124.0",
    "requests==2.32.3",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.9",
    "delta-spark==3.3.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
    # DECLARED, though it was already installed transitively (pre-commit depends
    # on it). tests/test_job_yaml_wiring.py parses the job YAMLs -- which table each
    # job hands its tasks is wiring no source-level test can see -- and a test
    # importing a package nobody declared keeps working only for as long as the
    # package that happens to pull it in stays in this list.
    "pyyaml==6.0.3",
    # DECLARED for the same reason as pyyaml above, and it was likewise already
    # present -- but only inside the ISOLATED build environment PEP 517 creates from
    # `[build-system] requires`, which the test suite cannot see.
    # tests/test_revision_stamp.py loads `hatch_build.py`, whose base class comes from
    # here, and the hook is what puts the revision into the deployed wheel. Pinned at
    # the version the current wheel's own metadata names as its generator
    # (`Generator: hatchling 1.31.0`), so what the tests read is what builds the
    # artefact.
    "hatchling==1.31.0",
    "psycopg[binary]==3.2.3",
    "confluent-kafka==2.6.1",
    "pre-commit==4.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opl"]

# STAMPS THE GIT REVISION INTO THE WHEEL. `hatch_build.py` generates
# `opl/_revision.py` on every non-editable build -- i.e. on the `uv build --wheel`
# that `databricks bundle deploy` runs -- so the deployed artefact can state what it
# was built from and `opl.bronze.provenance` can refuse a run whose code is not the
# code that was launched (ADR 0009). The `version` is deliberately left static:
# putting the revision there would put it in the wheel FILENAME, and the jobs install
# through a glob over a `dist/` that nothing cleans.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the docker compose stack running",
  # DIAGNOSTIC, NOT A DESELECTION -- deliberately absent from `addopts` below, so a
  # marked test still runs in every default invocation. It labels the tests whose
  # runtime is dominated by something other than the assertion (a real `uv build
  # --wheel`, which on a cold uv cache resolves and downloads), so a CI failure that
  # is a timeout can be read as environment rather than as a regression in the thing
  # being tested. Deselect it explicitly (`-m 'not integration and not slow'`) when
  # that is what you want.
  "slow: dominated by build or download time, not by the assertion",
  # A DESELECTION IN ITS OWN RIGHT, and that is the whole point. `-m integration` selects
  # Redpanda and two live-WebDAV modules as well, so a CI job with only a Postgres
  # `services:` block turns red on five of six tests -- which is why a Postgres-only job
  # cannot use it (plan T2b). Tests carrying this marker also carry `integration`, but the
  # `not postgres` term below is what makes the marker load-bearing on its own: a future
  # container test that forgets `integration` is still deselected by default.
  "postgres: requires only the local Postgres container",
  # THE SAME DESELECTION, FOR THE OTHER CONTAINER, and it exists for the reason the comment
  # above gives rather than by symmetry. `tests/integration/test_payment_streaming_live.py`
  # needs a Redpanda broker and nothing else, so F5 T6's CI job selects `-m redpanda` the way
  # the Postgres job selects `-m postgres`; `-m integration` would pull in Postgres and two
  # live-WebDAV modules and turn red on them. `not redpanda` below is load-bearing on its own
  # for the same reason `not postgres` is: a future broker test that forgets `integration` is
  # still deselected from every default invocation.
  "redpanda: requires only the local Redpanda container",
]
addopts = "-m 'not integration and not postgres and not redpanda'"
